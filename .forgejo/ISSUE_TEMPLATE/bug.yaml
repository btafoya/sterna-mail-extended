name: Bug report
about: Something does not work as it should
labels:
  - bug
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sterna version
      description: Settings → About
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: Account type
      options:
        - JMAP
        - IMAP
        - Both
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
